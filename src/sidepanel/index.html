<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BGA Strategy Assistant</title>
    <style>
      /* ── Reset & base ─────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:        #1e1e2e;
        --surface:   #2a2a3c;
        --border:    #3a3a50;
        --text:      #e0e0f0;
        --muted:     #9090aa;
        --accent:    #7c9df0;
        --user-bg:   #3b4a7a;
        --user-text: #dce8ff;
        --asst-bg:   #2d2d40;
        --asst-text: #e0e0f0;
        --err-bg:    #4a2030;
        --err-text:  #ffb3b3;
        --btn-bg:    #4a5fa8;
        --btn-hover: #5a72c0;
        --input-bg:  #252535;
      }

      html, body {
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        background: var(--bg);
        color: var(--text);
      }

      /* ── App shell ────────────────────────────────────────── */
      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100%;
        max-width: 420px;
        margin: 0 auto;
      }

      /* ── Header ───────────────────────────────────────────── */
      #header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      #header h1 {
        font-size: 14px;
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #settings-toggle {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        font-size: 18px;
        padding: 2px 4px;
        line-height: 1;
        border-radius: 4px;
        flex-shrink: 0;
      }
      #settings-toggle:hover { color: var(--accent); background: var(--border); }

      /* ── Settings panel (overlay) ─────────────────────────── */
      #settings-panel {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        z-index: 100;
        display: none;
        flex-direction: column;
        padding: 16px;
        overflow-y: auto;
      }
      #settings-panel.open { display: flex; }

      #settings-panel h2 {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #settings-close {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        font-size: 18px;
        padding: 0 4px;
        line-height: 1;
      }
      #settings-close:hover { color: var(--text); }

      .field {
        margin-bottom: 14px;
      }

      .field label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .field input[type="password"],
      .field input[type="text"],
      .field select {
        width: 100%;
        padding: 7px 10px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
        outline: none;
      }
      .field input:focus,
      .field select:focus { border-color: var(--accent); }

      .field select option { background: var(--surface); }

      #detected-player {
        font-size: 13px;
        color: var(--text);
        padding: 7px 10px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      #detected-player.undetected { color: var(--muted); font-style: italic; }

      .radio-group {
        display: flex;
        gap: 16px;
        margin-top: 2px;
      }
      .radio-group label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text);
        cursor: pointer;
      }

      #settings-save {
        padding: 8px 18px;
        background: var(--btn-bg);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 4px;
        align-self: flex-start;
      }
      #settings-save:hover { background: var(--btn-hover); }

      #settings-status {
        font-size: 12px;
        color: var(--accent);
        margin-top: 8px;
        min-height: 16px;
      }

      /* ── Status bar ───────────────────────────────────────── */
      #status-bar {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 4px 14px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        font-size: 11px;
        color: var(--muted);
        min-height: 24px;
        flex-wrap: wrap;
      }

      #status-game { font-weight: 500; color: var(--text); }

      #status-build {
        margin-left: auto;
        font-size: 10px;
        color: #7ec8e3;
        font-family: monospace;
      }

      /* ── Chat thread ──────────────────────────────────────── */
      #chat-thread {
        flex: 1;
        overflow-y: auto;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .bubble {
        max-width: 88%;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 13px;
        line-height: 1.55;
        word-break: break-word;
        white-space: pre-wrap;
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--user-bg);
        color: var(--user-text);
        border-bottom-right-radius: 3px;
      }

      .bubble.assistant {
        align-self: flex-start;
        background: var(--asst-bg);
        color: var(--asst-text);
        border-bottom-left-radius: 3px;
        border: 1px solid var(--border);
      }

      .bubble.error {
        align-self: flex-start;
        background: var(--err-bg);
        color: var(--err-text);
        border-bottom-left-radius: 3px;
        font-size: 12px;
      }

      .bubble.thinking {
        align-self: flex-start;
        background: var(--asst-bg);
        color: var(--muted);
        border: 1px solid var(--border);
        border-bottom-left-radius: 3px;
        font-style: italic;
        font-size: 12px;
      }

      /* ── Rulebook status bar ──────────────────────────────── */
      #rulebook-bar {
        flex-shrink: 0;
        padding: 7px 14px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        min-height: 34px;
      }

      #rulebook-status { flex: 1; }

      #upload-label {
        cursor: pointer;
        padding: 4px 10px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 5px;
        font-size: 12px;
        color: var(--accent);
        white-space: nowrap;
      }
      #upload-label:hover { border-color: var(--accent); }
      #upload-input { display: none; }

      /* ── Input bar ────────────────────────────────────────── */
      #input-bar {
        flex-shrink: 0;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        padding: 10px 14px;
        background: var(--surface);
        border-top: 1px solid var(--border);
      }

      #message-input {
        flex: 1;
        padding: 8px 10px;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 13px;
        font-family: inherit;
        resize: none;
        min-height: 36px;
        max-height: 120px;
        outline: none;
        line-height: 1.45;
      }
      #message-input:focus { border-color: var(--accent); }
      #message-input::placeholder { color: var(--muted); }

      #send-btn {
        padding: 8px 14px;
        background: var(--btn-bg);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
        height: 36px;
      }
      #send-btn:hover { background: var(--btn-hover); }
      #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <div id="app">

      <!-- ── Settings overlay ─────────────────────────────── -->
      <div id="settings-panel" role="dialog" aria-label="Settings">
        <h2>
          Settings
          <button id="settings-close" title="Close settings">✕</button>
        </h2>

        <div class="field">
          <label>Detected BGA Player</label>
          <div id="detected-player" class="undetected">No BGA player detected — open a BGA game tab</div>
        </div>

        <div class="field">
          <label for="openai-key">OpenAI API Key</label>
          <input type="password" id="openai-key" placeholder="sk-…" autocomplete="off" />
        </div>

        <div class="field">
          <label for="anthropic-key">Anthropic API Key</label>
          <input type="password" id="anthropic-key" placeholder="sk-ant-…" autocomplete="off" />
        </div>

        <div class="field">
          <label>LLM Provider</label>
          <div class="radio-group">
            <label>
              <input type="radio" name="provider" value="openai" id="provider-openai" />
              OpenAI
            </label>
            <label>
              <input type="radio" name="provider" value="anthropic" id="provider-anthropic" />
              Anthropic
            </label>
          </div>
        </div>

        <button id="settings-save">Save</button>
        <div id="settings-status"></div>
      </div>

      <!-- ── Header ───────────────────────────────────────── -->
      <div id="header">
        <h1>♟ BGA Strategy Assistant</h1>
        <button id="settings-toggle" title="Settings">⚙</button>
      </div>

      <!-- ── Status bar ────────────────────────────────────── -->
      <div id="status-bar">
        <span id="status-game">Game: —</span>
        <span id="status-player">Player: —</span>
        <span id="status-build" title="Build timestamp"></span>
      </div>

      <!-- ── Chat thread ───────────────────────────────────── -->
      <div id="chat-thread" role="log" aria-live="polite"></div>

      <!-- ── Rulebook status bar ───────────────────────────── -->
      <div id="rulebook-bar">
        <span id="rulebook-status">Checking rulebook…</span>
        <label id="upload-label" style="display:none">
          Upload PDF
          <input type="file" id="upload-input" accept="application/pdf" />
        </label>
      </div>

      <!-- ── Input bar ─────────────────────────────────────── -->
      <div id="input-bar">
        <textarea
          id="message-input"
          placeholder="Ask a strategy question…"
          rows="1"
        ></textarea>
        <button id="send-btn">Send</button>
      </div>

    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
